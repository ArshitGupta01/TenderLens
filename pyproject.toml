[project]
name = "tenderlens"
version = "0.1.0"
description = "Evidence-backed tender review for Indian public procurement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.7.2",
    "playwright>=1.64.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
